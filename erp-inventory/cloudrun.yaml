apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bm-motors-erp
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        # Scale-to-zero absolu : 0 instance lorsque le magasin est fermé (coût 0.00 €/an garanti)
        autoscaling.knative.dev/minScale: "0"
        # Plafond de protection anti-débordement budgétaire
        autoscaling.knative.dev/maxScale: "2"
        # Throttling CPU actif hors requête pour rester 100% dans le quota gratuit Google Cloud
        run.googleapis.com/cpu-throttling: "true"
        # Démarrage rapide du conteneur
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: bm-motors-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/bm-motors-erp:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1000m"      # 1 vCPU (Quota gratuit : 180 000 vCPU-secondes/mois)
              memory: "512Mi"    # 512 Mo RAM (Quota gratuit : 360 000 GiB-secondes/mois)
          env:
            - name: NODE_ENV
              value: "production"
            # Les secrets critiques sont injectés de manière sécurisée via Secret Manager
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: NEON_DATABASE_URL
                  key: latest
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: RESEND_API_KEY
                  key: latest
